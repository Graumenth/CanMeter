[package]
name = "canmeter-core"
description = "CanMeter çekirdeği: yakalama, protokol, savaş olayları, istatistik, replay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Npcap/libpcap sarıcısı. Windows'ta wpcap.lib'e link eder; SDK'yı build.rs bulur
# (repo sürücüsünde DerlemeAraclari/npcap-sdk ya da NPCAP_SDK). Npcap'siz makinede yalnız canlı yakalama hata verir.
pcap = "2.5"
# UI veri sözleşmesi (stats) JSON'a bu türevlerle çevrilir.
serde = { version = "1", features = ["derive"] }
# Kapanan savaşı encounter dosyasına yazmak için (şema v1 ortak crate, JSON satırları).
canmeter-sema = { path = "../sema" }
serde_json = "1"
# Kayıt aracı (src/bin/kaydet.rs): temiz kapanış ve dosya adı zaman damgası.
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Oyun akışındaki FF FF bundle'ları: LZ4 blok açma (güvenli çözücü, çerçeve biçimi gereksiz).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
